  - uid: sigma-e57d9652caa54b
    title: Linux Security Service Stopped
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dfpmdh15h9d6oc
      model:
        editorMode: code
        expr: |-
          sum by (host) (
            count_over_time(
              {job="systemd-journal"} |~ `(?i)Stopped\ fail2ban\.service|Stopped\ ssh\.service|Stopped\ ufw\.service` [5m]
            )
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        queryType: instant
        refId: A
    - refId: C
      queryType: expression
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      severity: medium
      summary: Linux Security Service Stopped en {{ $labels.host }}
      description: systemd registro la detencion de un servicio de defensa del host
        (fail2ban, ssh o ufw). Un atacante con privilegios suele apagar las defensas
        antes de actuar. Complementa al dead man's switch, que cubre la caida del
        agente de logs. (attack.t1685)
    isPaused: false
    notification_settings:
      receiver: telegram-alertas
