        queryType: instant
        refId: A
    - refId: C
      queryType: expression
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      ip: '{{ $labels.ip }}'
      severity: high
      summary: 'Potential OpenSSH Daemon Exploitation Attempt - Client Crash Penalty:
        actividad desde {{ $labels.ip }}'
      description: 'Detects the OpenSSH daemon applying a "caused crash" PerSourcePenalties
        penalty against a client address whose behaviour crashed the sshd pre-auth
        session process. A pre-authentication crash of sshd triggered by client behaviour
        is a strong indicator of an exploitation attempt against the SSH daemon, such
        as memory corruption or race condition exploits (e.g. CVE-2024-6387 "regreSSHion").
        The PerSourcePenalties feature was introduced in OpenSSH 9.8 and is enabled
        by default. This rule matches the penalty creation, its activation, and subsequent
        refused connections from the penalised address. Contributed to SigmaHQ (PR
        #6127); the i3 runs OpenSSH 10.2p1, so the lab can now exercise it. (attack.t1190)'
    isPaused: false
    notification_settings:
      receiver: n8n
      group_by:
      - grafana_folder
      - alertname
      - ip
