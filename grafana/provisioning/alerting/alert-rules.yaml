apiVersion: 1
groups:
- orgId: 1
  name: sigma-generated
  folder: Security
  interval: 1m
  rules:
  - uid: sigma-a15745b13e8e4a
    title: SSH Authentication Failure
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: dfpmdh15h9d6oc
      model:
        editorMode: code
        expr: |-
          sum by (ip) (
            count_over_time(
              {job="systemd-journal"} |~ `(?i)Failed\ password\ for|Invalid\ user` | regexp `(?P<ip>\d+\.\d+\.\d+\.\d+)` [5m]
            )
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        queryType: instant
        refId: A
    - refId: C
      queryType: expression
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 3
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      ip: '{{ $labels.ip }}'
      severity: medium
      summary: 'SSH Authentication Failure: actividad desde {{ $labels.ip }}'
    isPaused: false
    notification_settings:
      receiver: n8n
