server {
    listen 80 default_server;
    server_name _;

    # No delatar la versión de nginx
    server_tokens off;

    # ----------------------------------------------------------------------
    # IP real del visitante. Con port forwarding directo NO hace falta tocar
    # nada: $remote_addr ya es la IP pública del cliente.
    # Si el sitio queda detrás de un túnel o de otro proxy (cloudflared,
    # Caddy), nginx ve la IP del proxy en todos los pedidos: las reglas por IP
    # agrupan todo junto y el SOAR propondría banear al proxy. En ese caso,
    # descomentar y ajustar (red del proxy + cabecera que manda):
    #
    #   set_real_ip_from 172.16.0.0/12;
    #   real_ip_header   CF-Connecting-IP;   # o X-Forwarded-For
    # ----------------------------------------------------------------------

    # Cabeceras de seguridad, también en las respuestas de error.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Todo va al backend Flask. Las rutas inexistentes (incluidas las sondas
    # a /.env, /.git/, backups) llegan al backend y devuelven 404, quedando
    # registradas en el log con su patrón.
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si el backend se cae, nginx responde 502/504: señal de web_5xx_spike.
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }
}
