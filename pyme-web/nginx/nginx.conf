user  nginx;
worker_processes  auto;
# Los errores van a `docker logs laesquina-nginx`.
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------------
    # Log de acceso en JSON. Esta es la fuente de telemetría del Mini SOC:
    # Alloy lee este archivo y lo envía a Loki. Cada campo se extrae después
    # en LogQL; NO se usan como labels de Loki (la IP y el path harían
    # explotar la cardinalidad).
    #
    # "request" es la línea cruda del pedido. Hace falta porque cuando nginx
    # rechaza el pedido con 400 (por ejemplo un traversal en el path,
    # /static/../../etc/passwd), "uri" y a veces "method" quedan vacíos y el
    # único lugar donde se ve el intento es "request".
    # ----------------------------------------------------------------------
    log_format json_acceso escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"http_host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
      '}';

    access_log /var/log/nginx/acceso.json json_acceso;

    sendfile on;

    # Límites para un sitio expuesto: el único cuerpo legítimo es el form de
    # login, y una conexión lenta no tiene por qué ocupar un worker un minuto.
    # A propósito NO hay limit_req/limit_conn: frenarían gobuster, ffuf y la
    # fuerza bruta antes de que dejen el patrón que las reglas tienen que ver.
    client_max_body_size   16k;
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           10s;
    keepalive_timeout      15s;

    include /etc/nginx/conf.d/*.conf;
}
