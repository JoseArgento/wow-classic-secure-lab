{% extends "base.html" %}
{% block titulo %}Ingresar — Almacén La Esquina{% endblock %}
{% block contenido %}
<section class="login">
  <h1>Ingresar</h1>
  {% if error %}<p class="error">Usuario o contraseña incorrectos.</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label>Usuario <input type="text" name="usuario" autocomplete="username"></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
