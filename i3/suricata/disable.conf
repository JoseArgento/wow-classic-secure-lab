# /etc/suricata/disable.conf - firmas que suricata-update deja desactivadas.
# suricata-update lee este archivo solo. Cada entrada es un falso positivo
# conocido de ESTE lab, con su motivo: desactivar sin explicar es ceguera.

# El propio i3 actualiza su DNS dinámico en DuckDNS cada 5 minutos
# (/etc/cron.d/duckdns): las firmas de "consulta a dominio dinámico"
# disparaban ~288 veces por día por tráfico legítimo y propio.
# Riesgo aceptado: un malware en el i3 que usara DuckDNS como C2 no
# dispararía estas firmas (sí las de comportamiento, y el resto del SOC).
re:duckdns
