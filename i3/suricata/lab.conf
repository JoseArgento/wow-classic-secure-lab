# /etc/systemd/system/suricata.service.d/lab.conf
# Drop-in: ajusta Suricata al i3. Se pisa solo ExecStart.
#
# - af-packet.0.interface: la config de fábrica escucha en eth0; acá la placa
#   es eno1. Se cambia el nombre en la primera entrada de af-packet para
#   conservar su tuning (cluster_flow, defrag). La captura no se reconfigura
#   en un reload de reglas, así que --set alcanza.
#
# - HOME_NET NO va acá: vive en /etc/suricata/suricata.yaml (ver README).
#   Un reload de reglas (el cron diario de suricata-update) vuelve a leer el
#   YAML y descarta lo que vino por --set. Con HOME_NET en --set, después del
#   primer reload HOME_NET volvió al default (todas las redes privadas), la
#   Kali pasó a ser "casa" y las firmas EXTERNAL_NET -> HOME_NET dejaron de
#   verla, sin ningún error en el log. Detectado en la prueba del 28/10.
#
# Modo IDS (pasivo): AF_PACKET recibe una COPIA de los paquetes. Suricata no
# bloquea; la respuesta sigue siendo fail2ban con aprobación humana.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D --af-packet -c /etc/suricata/suricata.yaml --pidfile /var/run/suricata/suricata.pid \
    --set af-packet.0.interface=eno1
