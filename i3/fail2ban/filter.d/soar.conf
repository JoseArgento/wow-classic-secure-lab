# /etc/fail2ban/filter.d/soar.conf - filtro dummy de los jails del SOAR.
# Nunca matchea nada real: los bans entran solo por
# `fail2ban-client set <jail> banip <ip>` (desde soar-ban.sh).
# fail2ban exige un grupo <HOST> en el failregex.
[Definition]
failregex = ^soar-manual-ban-never-matches <HOST>$
ignoreregex =
