# /etc/sysctl.d/99-lab-hardening.conf - endurecimiento del kernel del i3
# Aplicar: sudo sysctl --system      Verificar: ver i3/README.md
#
# Criterio: solo parámetros que no rompen nada de lo que corre acá
# (Docker, VMaNGOS, Valheim, Alloy, fail2ban). Varios ya vienen así en
# Ubuntu; se fijan igual para que el estado quede declarado y versionado.

# --- Reenvío de paquetes: EXCEPCIÓN DOCUMENTADA ---------------------------
# Las guías (CIS) piden ip_forward=0, pero este host corre Docker: sin
# reenvío, los puertos publicados (3724, 8085) no llegan a los containers.
# Va PRIMERO a propósito: cambiar ip_forward resetea los parámetros por
# interfaz (redirects, source route) a sus defaults. Fijándolo en 1 antes
# que el resto, Docker lo encuentra ya en 1 al arrancar y no lo cambia.
net.ipv4.ip_forward = 1

# --- Red: no aceptar que otro decida nuestras rutas -----------------------
# "all" cubre las interfaces actuales; "default", las que se crean después
# (docker0, los veth de cada container).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Este host no es un router de la LAN: no manda redirects a nadie.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Registrar paquetes con origen imposible (spoofing) en el kernel log:
# llegan a Loki por el journal (job=systemd-journal, host=i3).
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Defaults de Ubuntu, fijados explícitamente.
net.ipv4.tcp_syncookies = 1                     # resiste SYN flood
net.ipv4.icmp_echo_ignore_broadcasts = 1        # no participar de smurf
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_rfc1337 = 1                        # TIME-WAIT assassination

# --- Kernel: menos información y menos superficie para un atacante local --
kernel.kptr_restrict = 2            # oculta direcciones del kernel (ayudan a explotar)
kernel.dmesg_restrict = 1           # dmesg solo para root
kernel.yama.ptrace_scope = 2        # solo root puede inspeccionar procesos ajenos
kernel.kexec_load_disabled = 1      # no se puede cargar otro kernel en caliente
kernel.unprivileged_bpf_disabled = 1  # eBPF solo root (1 = hasta el próximo reboot, no se puede volver a 0)
net.core.bpf_jit_harden = 2

# --- Sistema de archivos ---------------------------------------------------
fs.suid_dumpable = 0                # un binario setuid que crashea no deja core con secretos
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
