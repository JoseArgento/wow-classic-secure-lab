# vm.conf - recursos de la VM "observabilidad" (Loki + Grafana)
# Se commitea: no tiene nada sensible.

RAM_MB=6144        # Loki + Grafana andan con 4096; 6 GB deja margen para queries largas
CPUS=2
DISK_MB=40960      # 40 GB: Loki acumula logs; agrandar después es más molesto

# MAC fija (prefijo 08:00:27 de VirtualBox) para crear la reserva DHCP en el
# router ANTES de crear la VM. Si tenés otra VM con esta MAC, cambiá los
# últimos dígitos.
MAC_ADDRESS=080027AA0B01
